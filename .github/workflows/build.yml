name: Build

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build Process
        run: |
          mkdir -p build output
          docker run --rm \
            --cpus=2 \
            --privileged \
            --platform ${{ matrix.platform }} \
            -v "${{ github.workspace }}":/workspace \
            -w /workspace \
            debian:trixie \
            bash -c "
              apt-get update &&
              apt-get install -y debootstrap squashfs-tools grub2-common xorriso mtools python3 &&
              python3 build.py PersisOS-2.0-${{ matrix.arch }}.json --workdir build --outdir output
            "

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: persisos-${{ matrix.arch }}
          path: output/*.iso
          compression-level: 0
          retention-days: 30