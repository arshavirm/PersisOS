name: Build PersisOS

on:
  push:
    branches: ["main"]
    paths:
      - "PersisOS-2.0-*.json"
      - "assets/**"
      - "build.py"
      - "tests/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "PersisOS-2.0-*.json"
      - "assets/**"
      - "build.py"
      - "tests/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate configuration
        run: |
          python3 -m py_compile build.py
          python3 -m unittest discover -s tests -v

      - name: Build ISO (${{ matrix.arch }})
        run: |
          docker run --rm --privileged \
            --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}:/work \
            -w /work \
            debian:trixie \
            bash -c "
              set -euo pipefail && \
              export DEBIAN_FRONTEND=noninteractive && \
              apt-get update -qq && \
              apt-get install -y \
                debootstrap squashfs-tools grub2-common \
                ${{ matrix.arch == 'amd64' && 'grub-pc-bin grub-efi-amd64-bin' || 'grub-efi-arm64-bin' }} \
                xorriso mtools dosfstools python3 && \
              python3 build.py PersisOS-2.0-${{ matrix.arch }}.json \
                --workdir build --outdir output
            "

      - name: Upload artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: persisos-${{ matrix.arch }}
          path: output/
          if-no-files-found: error
