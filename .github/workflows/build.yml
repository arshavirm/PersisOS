name: Build

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        run: sudo apt install debootstrap squashfs-tools grub2-common xorriso mtools python3

      - name: Build Process
        run: |
          sudo python3 build.py PersisOS-2.0-${{ matrix.arch }}.json --workdir build --outdir output

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: persisos-${{ matrix.arch }}
          path: output/*.iso
          compression-level: 0
          retention-days: 30