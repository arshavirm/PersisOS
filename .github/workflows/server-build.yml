name: Build PersisOS Server

on:
  push:
    branches: ["main"]
    paths:
      - "PersisOS-Server-2.0-amd64.json"
      - "build.py"
      - "tests/**"
      - ".github/workflows/server-build.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "PersisOS-Server-2.0-amd64.json"
      - "build.py"
      - "tests/**"
      - ".github/workflows/server-build.yml"
  workflow_dispatch:

jobs:
  build-server:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          python3 -m py_compile build.py
          python3 -m unittest discover -s tests -v

      - name: Build server ISO (amd64)
        run: |
          docker run --rm --privileged \
            --platform linux/amd64 \
            -v ${{ github.workspace }}:/work \
            -w /work \
            debian:trixie \
            bash -c "
              set -euo pipefail &&
              export DEBIAN_FRONTEND=noninteractive &&
              apt-get update -qq &&
              apt-get install -y --no-install-recommends \
                debootstrap squashfs-tools grub2-common \
                grub-pc-bin grub-efi-amd64-bin \
                xorriso mtools dosfstools python3 &&
              python3 build.py PersisOS-Server-2.0-amd64.json \
                --workdir build-server --outdir output-server
            "

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: persisos-server-amd64
          path: output-server/
          if-no-files-found: error
