name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate configuration
        run: |
          python3 -m py_compile build.py
          python3 -m unittest discover -s tests -v

      - name: Build ISO (${{ matrix.arch }})
        run: |
          docker run --rm --privileged \
            --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            debian:trixie \
            bash -c "
              export DEBIAN_FRONTEND=noninteractive && \
              apt-get update -qq && \
              apt-get install -y --no-install-recommends \
                debootstrap squashfs-tools grub2-common \
                ${{ matrix.arch == 'amd64' && 'grub-pc-bin grub-efi-amd64-bin' || 'grub-efi-arm64-bin' }} \
                xorriso mtools dosfstools python3 && \
              python3 build.py PersisOS-2.0-${{ matrix.arch }}.json \
                --workdir build --outdir output
            "

      - name: Upload ISO to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            output/*.iso
