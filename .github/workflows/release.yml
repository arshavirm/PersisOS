name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write   

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Process
        run: |
          docker run --rm \
            --privileged \
            --platform ${{ matrix.platform }} \
            -v "${{ github.workspace }}":/workspace \
            -w /workspace \
            debian:trixie \
            bash -c "
              export DEBIAN_FRONTEND=noninteractive &&
              apt-get update -qq &&
              apt-get install -y --no-install-recommends debootstrap squashfs-tools grub2-common xorriso mtools python3 &&
              python3 build.py PersisOS-2.0-${{ matrix.arch }}.json --workdir build --outdir output
            "

      - name: Upload ISO to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            output/*.iso
