#!/bin/bash
# PersisOS Build Configuration
# Simple key=value format for easy editing

# ============================================================================
# DISTRO INFORMATION
# ============================================================================
DISTRO_NAME="PersisOS"
DISTRO_VERSION="2.0"
DISTRO_HOSTNAME="PersisOS"

# ============================================================================
# DEBIAN SETTINGS
# ============================================================================
DEBIAN_DIST="stable"
DEBIAN_ARCH="amd64"
DEBIAN_MIRROR="http://deb.debian.org/debian"
DEBIAN_COMPONENTS="main contrib non-free non-free-firmware"

# Extra apt sources (one per line, empty by default)
EXTRA_APT_SOURCES=""

# ============================================================================
# DIRECTORY PATHS (relative to this config file)
# ============================================================================
ASSETS_DIR="assets"
ROOTFS_DIR="rootfs"
LIVE_DIR="live"
ISO_WORK_DIR="iso"
OUTPUT_DIR="output"

# ============================================================================
# USER ACCOUNTS
# ============================================================================
ROOT_PASSWORD="root"

# Format: username:password:shell:groups:create_home
# Groups are comma-separated, create_home is yes/no
USERS=(
    "user:user:/bin/bash:sudo,netdev:yes"
)

# ============================================================================
# SERVICES TO ENABLE
# ============================================================================
SERVICES=(
    "sddm"
    "NetworkManager"
    "avahi-daemon"
)

# ============================================================================
# PACKAGES TO INSTALL
# ============================================================================
PACKAGES=(
    # Firmware
    "firmware-linux"
    "firmware-linux-free"
    "firmware-linux-nonfree"
    "firmware-misc-nonfree"
    "firmware-realtek"
    "firmware-atheros"
    "firmware-iwlwifi"
    "firmware-brcm80211"
    "firmware-mediatek"
    "linux-image-amd64"
    "live-boot"
    "live-config"
    "live-config-systemd"
    "grub2"
    "memtest86+"
    "shim-signed"
    "systemd"
    "systemd-sysv"
    
    # Network
    "network-manager"
    "wpasupplicant"
    "iw"
    "rfkill"
    "wireless-regdb"
    
    # Desktop
    "xorg"
    "sddm"
    "kde-plasma-desktop"
    "plasma-nm"
    "plasma-pa"
    
    # Applications
    "pipewire"
    "pipewire-pulse"
    "wireplumber"
    "alsa-utils"
    "wget"
    "p7zip-full"
    "zip"
    "unzip"
    "usbutils"
    "pciutils"
    "librsvg2-common"
    "dosfstools"
    "sudo"
    
    # Installer
    "calamares"
    "calamares-settings-debian"
)

# ============================================================================
# GRUB CONFIGURATION
# ============================================================================
GRUB_BACKGROUND="/usr/share/backgrounds/persisos/background_2.png"
GRUB_TERMINAL_OUTPUT="gfxterm"
GRUB_GFXMODE="auto"

# ============================================================================
# SQUASHFS SETTINGS
# ============================================================================
SQUASHFS_COMP="xz"
SQUASHFS_BLOCK_SIZE="1M"
SQUASHFS_EXCLUDE="boot/memtest86*"

# ============================================================================
# FINALIZATION OPTIONS
# ============================================================================
MACHINE_ID_SETUP="yes"
APT_AUTOREMOVE="yes"
APT_CLEAN="yes"
UPDATE_INITRAMFS="yes"

# ============================================================================
# PLYMOUTH THEME
# ============================================================================
PLYMOUTH_THEME="persisos"

# ============================================================================
# HOOK SCRIPTS
# ============================================================================
# Define custom scripts to run at different stages
# Available stages: before_rootfs, after_debootstrap, before_chroot, 
#                   after_chroot, after_rootfs, before_live, after_live,
#                   before_iso, after_iso

hook_before_rootfs() {
    # Runs on host before debootstrap
    :
}

hook_after_debootstrap() {
    # Runs on host after debootstrap completes
    :
}

hook_before_chroot() {
    # Runs on host before entering chroot
    :
}

hook_after_chroot() {
    # Runs on host after exiting chroot
    :
}

hook_after_rootfs() {
    # Runs on host after rootfs is complete
    :
}

hook_before_live() {
    # Runs on host before creating live filesystem
    :
}

hook_after_live() {
    # Runs on host after live filesystem is created
    :
}

hook_before_iso() {
    # Runs on host before building ISO
    :
}

hook_after_iso() {
    # Runs on host after ISO is built
    echo "Build complete! ISO available at: ${OUTPUT_DIR}/${DISTRO_NAME}-${DISTRO_VERSION}-${DEBIAN_ARCH}.iso"
}

# Chroot hooks - these run inside the chroot environment
# They are called after specific chroot operations

chroot_hook_after_sources() {
    # Runs in chroot after apt sources are configured
    :
}

chroot_hook_after_update() {
    # Runs in chroot after apt-get update
    # Example: exclude desktop-base package
    cat > /etc/apt/preferences.d/99-skip-desktop-base <<'EOF'
Package: desktop-base
Pin: release *
Pin-Priority: -1
EOF
}

chroot_hook_after_packages() {
    # Runs in chroot after packages are installed
    # Example: install apadana
    if command -v wget &>/dev/null; then
        wget -O /tmp/apadana.deb https://github.com/arshavirm/apadana/releases/download/1.2/apadana_1.2_amd64.deb && \
        apt-get install -y /tmp/apadana.deb --no-install-recommends && \
        rm -f /tmp/apadana.deb || true
    fi
}
