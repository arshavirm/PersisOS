set timeout=5
set default=0

menuentry "Try and Install PersisOS" {
    linux /live/vmlinuz boot=live components quiet loglevel=3 systemd.show_status=auto rd.udev.log_level=3
    initrd /live/initrd
}

menuentry "Memory Test (memtest86+)" {
    linux16 /boot/memtest86+.bin
}

menuentry "Memory Test (memtest86+, UEFI)" {
    insmod chain
    chainloader /boot/memtest86+.efi
}