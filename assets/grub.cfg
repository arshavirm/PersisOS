set timeout=5
set default=0

menuentry "Try and Install PersisOS" {
    linux /live/vmlinuz boot=live quiet splash loglevel=3 systemd.show_status=false rd.udev.log_level=3
    initrd /live/initrd
}

menuentry "Try and Install PersisOS (verbose, diagnostic)" {
    linux /live/vmlinuz boot=live
    initrd /live/initrd
}

menuentry "Try and Install PersisOS (safe graphics / nomodeset)" {
    linux /live/vmlinuz boot=live nomodeset
    initrd /live/initrd
}

menuentry "Memory Test (memtest86+64)" {
    linux16 /boot/memtest86+x64.bin
}

menuentry "Memory Test (memtest86+64, UEFI)" {
    insmod chain
    chainloader /boot/memtest86+x64.efi
}