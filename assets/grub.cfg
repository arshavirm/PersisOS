set timeout=5
set default=0

menuentry "Try PersisOS" {
    linux /live/vmlinuz boot=live components quiet loglevel=3 systemd.show_status=auto rd.udev.log_level=3
    initrd /live/initrd
}

menuentry "Install PersisOS" {
    linux /live/vmlinuz boot=live components quiet textonly install-mode loglevel=3 systemd.show_status=auto rd.udev.log_level=3
    initrd /live/initrd
}

