---
# Configuration for the "Additional Packages" screen.
mode: optionalmultiple
method: packages
 
labels:
    step: "Additional Packages"
 
items:
    - id: gimp
      packages: [ gimp ]
      name: "GIMP"
      description: "Full-featured image editor and photo retouching tool."
 
    - id: libreoffice
      packages: [ libreoffice ]
      name: "LibreOffice"
      description: "Complete office suite: documents, spreadsheets, and presentations."
 
    - id: thunderbird
      packages: [ thunderbird ]
      name: "Thunderbird"
      description: "Email, calendar, and contacts client."
 
    - id: inkscape
      packages: [ inkscape ]
      name: "Inkscape"
      description: "Vector graphics editor for illustrations and diagrams."
 
    - id: steam
      packages: [ steam-installer ]
      name: "Steam"
      description: "Digital game store and library for PC gaming. Requires i386 multiarch to be enabled on the target (dpkg --add-architecture i386)."
 
    - id: geany
      packages: [ geany ]
      name: "Geany"
      description: "Lightweight source code editor and IDE with support for many languages."
 
    - id: obs
      packages: [ obs-studio ]
      name: "OBS Studio"
      description: "Screen recording and live streaming software."
 
    - id: audacity
      packages: [ audacity ]
      name: "Audacity"
      description: "Multi-track audio editor and recorder."
 
