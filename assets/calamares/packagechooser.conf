mode: required
method: packages
sidebar: widget

labels:
  step: "Extra Software"

items:
  - id: minimal
    name: "No additional software"
    description: "Install only the base system, without any extra applications."
    packages: []
    default: true

  - id: standard
    name: "A few additional software"
    description: "Install the base system plus a small set of commonly used applications for everyday use."
    packages: [firefox-esr, libreoffice-writer, libreoffice-calc, galculator, vlc]

  - id: full
    name: "Full additional software"
    description: "Install the base system plus a full suite of everyday, media, and productivity applications."
    packages: [firefox-esr, libreoffice, audacity, galculator, vlc, ffmpeg, fonts-liberation]
