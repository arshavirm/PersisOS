mode: optionalmulti
method: packages
sidebar: widget

labels:
  step: "Extra Software"

items:
  - id: internet
    name: "Internet & Communication"
    description: "Web browser, email client, and chat."
    packages: [firefox-esr, thunderbird]

  - id: office
    name: "Office & Productivity"
    description: "Word processor, spreadsheets, and presentations."
    packages: [libreoffice-writer, libreoffice-calc, libreoffice-impress]

  - id: multimedia
    name: "Multimedia"
    description: "Video/music playback and basic audio editing."
    packages: [vlc, audacity, ffmpeg]

  - id: graphics
    name: "Graphics & Design"
    description: "Image editing and vector illustration."
    packages: [gimp, inkscape]

  - id: bluetooth
    name: "Bluetooth Support"
    description: "Drivers and a manager for Bluetooth devices."
    packages: [bluez, blueman]

  - id: development
    name: "Development Tools"
    description: "Git, compilers, and a lightweight code editor."
    packages: [git, build-essential, geany]

  - id: accessibility
    name: "Accessibility"
    description: "Screen reader and on-screen keyboard."
    packages: [orca, onboard]

  - id: utilities
    name: "System Utilities"
    description: "Disk partitioning, backups, and package management GUI."
    packages: [gparted, timeshift, synaptic]