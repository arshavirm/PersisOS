---
# PersisOS Calamares installer configuration
modules-search: [ local ]
branding: persisos

# Keep the installer deterministic on Debian and avoid relying on distro-wide
# defaults that may not be present in a minimal live image.
configuration-search: [ local ]
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - packagechooser
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - shellprocess
      - packages
      - initramfs
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
